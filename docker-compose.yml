version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wamanager_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn wamanager.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/wamanager_db
      - GATEWAY_URL=http://gateway:8081/api/sessions/default
    depends_on:
      - db
    restart: always

  worker:
    build: .
    command: python manage.py qcluster
    environment:
      - DATABASE_URL=postgres://admin:secretpassword@db:5432/wamanager_db
      - GATEWAY_URL=http://gateway:8081/api/sessions/default
    depends_on:
      - db
    restart: always

  gateway:
    image: rmyndharis/openwa:latest
    ports:
      - "8081:8081"
    environment:
      - WA_CLI_TIMEOUT=60000
    volumes:
      - wa_session_data:/app/.wwebjs_auth
    restart: always

volumes:
  postgres_data:
  wa_session_data:
